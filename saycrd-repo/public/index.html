<style>
:root{
  /* ═══ Fluid layout tokens ═══
     Below ~517px viewport these resolve to the app's original fixed values
     (identical to the pre-existing design on phones), then grow smoothly as
     the viewport widens so the same "centered card" composition scales up
     instead of staying frozen at phone width on tablets/desktops. */
  --saycrd-shell-w: clamp(420px, 214px + 43vw, 760px);
  --saycrd-fs-hero: clamp(2rem, 1.72rem + 1.1vw, 2.75rem);
  --saycrd-fs-title: clamp(1.3rem, 1.16rem + 0.55vw, 1.65rem);
  --saycrd-fs-body: clamp(0.95rem, 0.92rem + 0.12vw, 1.05rem);
  --saycrd-pad: clamp(20px, 14px + 2.4vw, 40px);
}
/* ═══ True desktop override ═══
   Below this breakpoint every value above is untouched (phones/tablets keep
   the exact "focused card" sizing they already had). At real desktop widths
   the flow shell instead spans almost the full monitor, and type/spacing
   scale up further with it, so the app reads as a full desktop layout
   instead of a phone card stretched into empty space. */
@media (min-width: 1024px){
  :root{
    --saycrd-shell-w: min(94vw, 1680px);
    --saycrd-fs-hero: clamp(2.75rem, 1.4rem + 2vw, 4.25rem);
    --saycrd-fs-title: clamp(1.65rem, 1rem + 1vw, 2.35rem);
    --saycrd-fs-body: clamp(1.05rem, 0.85rem + 0.35vw, 1.25rem);
    --saycrd-pad: clamp(40px, 16px + 3vw, 72px);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{width:100%;min-height:100%;max-width:100vw;overflow-x:hidden;overflow-y:auto;background:linear-gradient(160deg,#0A0A2E 0%,#1A1A4B 40%,#2D1B6B 100%);-webkit-overflow-scrolling:touch}
::selection{background:rgba(107,184,255,0.5)!important;color:#fff!important}
::-moz-selection{background:rgba(107,184,255,0.5)!important;color:#fff!important}
body{background:linear-gradient(160deg,#0A0A2E 0%,#1A1A4B 40%,#2D1B6B 100%);background-attachment:fixed}

    /* ═══ Auth UI ═══ */
    .auth-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:1.5rem;background:rgba(6,9,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;transition:opacity .35s ease}
    .auth-overlay.is-visible{opacity:1}
    .auth-card{width:100%;max-width:380px;text-align:center;padding:2rem 1.75rem;background:rgba(12,15,22,.6);border:1px solid rgba(232,67,147,.15);border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,.4),0 0 0 1px rgba(184,107,255,.05);transform:translateY(8px);opacity:0;transition:transform .4s ease,opacity .4s ease}
    .auth-overlay.is-visible .auth-card{transform:translateY(0);opacity:1}
    .auth-logo{font-family:'Space Grotesk',sans-serif;font-size:2.4rem;letter-spacing:.4em;background:linear-gradient(90deg,#E84393,#B86BFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;font-weight:700;text-indent:.5em;margin-bottom:.5rem}
    .auth-sub{font-family:'DM Sans',sans-serif;font-size:1rem;color:rgba(232,67,147,.6);margin-bottom:2.5rem;font-weight:400}
    .auth-input{display:block;width:100%;background:rgba(14,17,21,.9);border:1px solid rgba(244,241,234,.12);border-radius:12px;color:rgba(247,241,231,.95);padding:.85rem 1rem;font-family:'Space Grotesk',sans-serif;font-size:.95rem;margin-bottom:.8rem;outline:none;transition:border-color .2s,box-shadow .2s;box-sizing:border-box}
    .auth-input:focus{border-color:rgba(232,67,147,.5);box-shadow:0 0 0 3px rgba(232,67,147,.12)}
    .auth-input::placeholder{color:rgba(244,241,234,.25)}
    .auth-btn{width:100%;padding:.85rem;border-radius:12px;border:1px solid rgba(232,67,147,.45);background:rgba(232,67,147,.12);color:rgba(255,255,255,.95);font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:all .2s ease;margin-top:.4rem;transform:translateY(0)}
    .auth-btn:hover{background:rgba(232,67,147,.22);border-color:rgba(232,67,147,.65);transform:translateY(-1px)}
    .auth-btn:active{transform:translateY(0);scale:.98}
    .auth-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .auth-toggle{margin-top:1.5rem;font-size:.85rem;color:rgba(247,241,231,.35)}
    .auth-toggle a{color:rgba(232,67,147,.7);cursor:pointer;text-decoration:none;transition:color .2s}
    .auth-toggle a:hover{color:rgba(232,67,147,.95)}
    .auth-error{color:rgba(196,110,95,.85);font-size:.82rem;margin-top:.6rem;min-height:1.2em;line-height:1.4}
    .auth-divider{display:flex;align-items:center;gap:1rem;margin:1.2rem 0;color:rgba(247,241,231,.2);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
    .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:rgba(244,241,234,.08)}
    .auth-social{width:100%;padding:.75rem;border-radius:12px;border:1px solid rgba(232,67,147,.2);background:rgba(255,255,255,.02);color:rgba(247,241,231,.6);font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:.5rem}
    .auth-social:hover{border-color:rgba(232,67,147,.4);color:rgba(247,241,231,.9);background:rgba(232,67,147,.06)}
    .auth-forgot{display:block;text-align:right;font-size:.82rem;color:rgba(232,67,147,.5);cursor:pointer;margin-top:-.3rem;margin-bottom:.5rem;transition:color .2s}
    .auth-forgot:hover{color:rgba(232,67,147,.85)}
    .auth-hidden{display:none!important}
    .ws-user{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:99998;font-size:.72rem;color:rgba(247,241,231,.3);cursor:pointer;letter-spacing:.04em;padding:8px 14px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s,border-color .2s,background .2s}
    .ws-user:hover{color:rgba(247,241,231,.7);border-color:rgba(255,255,255,.15);background:rgba(0,0,0,.5)}
    @media (max-width:768px){
      #ws-signout.ws-user{top:unset;left:unset;bottom:max(20px,env(safe-area-inset-bottom));right:max(20px,env(safe-area-inset-right));width:36px;height:36px;padding:0;font-size:0;border-radius:50%;display:flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;line-height:36px}
      #ws-signout.ws-user::before{content:attr(data-initial);font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:rgba(247,241,231,.7)}
      #ws-signout.ws-user:hover::before{color:rgba(247,241,231,.95)}
    }
    body.saycrd-landing #ws-signout{display:none!important}
    body.saycrd-internal #ws-signout{top:auto!important;bottom:max(20px,env(safe-area-inset-bottom))!important;left:auto!important;right:max(20px,env(safe-area-inset-right))!important;width:36px!important;height:36px!important;padding:0!important;font-size:0!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;min-width:36px!important;min-height:36px!important}
    body.saycrd-internal #ws-signout::before{content:attr(data-initial);font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:rgba(247,241,231,.7)}
    @media (prefers-reduced-motion: reduce){
      .auth-overlay,.auth-card,.auth-btn,.auth-input,.auth-social,.ws-user{transition:none}
      .auth-overlay.is-visible .auth-card{transform:none}
    }
</style>

                var sb=window.sbClient;if(!sb||!sb.auth){err.textContent='Database connecting... try again or use Continue without account';btn.disabled=false;return;}

                    msg='Wrong email or password. Try again or reset below.';
                  }
                  err.textContent=msg;btn.disabled=false;return;

                currentUser=r.data.user;window.currentUser=currentUser;

              var err=document.getElementById('auth-reset-error');err.textContent='';
              var em=document.getElementById('auth-reset-email').value.trim();

<script>
/* Global error handler — shows what's breaking */
window.onerror = function(msg, url, line, col, err) {
  console.error("SAYCRD ERROR:", msg, "line:", line);
  var errBox = document.getElementById("auth-error");
  if (errBox) errBox.textContent = "JS Error: " + msg + " (line " + line + ")";
  try {
    var root = document.getElementById("root");
    if (root && (!root.innerHTML || root.innerHTML.trim() === "")) {
      var details = "JS Error: " + msg + " (line " + line + ")";
      if (err && err.stack) details += "\n\n" + String(err.stack).slice(0, 2000);
      root.innerHTML = '<pre style="color:#ff6b6b;padding:20px;font-size:13px;white-space:pre-wrap">' + details.replace(/</g, "&lt;") + "</pre>";
    }
  } catch(e) {}
};

/* ====================================================================

  API_ENDPOINT: "/api/claude",
};

/* ====================================================================
   Supabase Client + Auth
   ==================================================================== */
var sbClient = null;
window.sbClient = null;
var supabaseAvailable = false;
try {
  sbClient = window.supabase.createClient(
    SAYCRD_CONFIG.SUPABASE_URL,
    SAYCRD_CONFIG.SUPABASE_ANON_KEY
  );
  window.sbClient = sbClient;
  supabaseAvailable = true;
  console.log("Supabase client initialized");
} catch(sbInitErr) {
  console.warn("Supabase unavailable:", sbInitErr.message || sbInitErr);
}

var currentUser = null;
window.currentUser = null;

/* ── Storage Adapter (drop-in replacement for window.storage) ── */
/* Saves to Supabase if authenticated + available, otherwise localStorage */
/* AUTH GATE: storage ops wait for auth to resolve before executing */
var _authReady = null;
var _authResolve = null;
_authReady = new Promise(function(resolve) { _authResolve = resolve; });
window._authResolve = _authResolve;
/* Timeout: if auth doesn't resolve in 5s, proceed with whatever we have */
setTimeout(function() { _authResolve(); }, 5000);

function _storageMode() {
  if (currentUser && supabaseAvailable && currentUser.id !== "local-user") return "supabase";
  return "local";
}
function _localGet(key) {
  var uid = (currentUser && currentUser.id) || "local-user";
  var v = localStorage.getItem("saycrd-" + uid + "-" + key);
  if (v === null) return null;
  return { key: key, value: v };
}
function _localSet(key, value) {
  var uid = (currentUser && currentUser.id) || "local-user";
  localStorage.setItem("saycrd-" + uid + "-" + key, value);
  return { key: key, value: value };
}
function _localDelete(key) {
  var uid = (currentUser && currentUser.id) || "local-user";
  localStorage.removeItem("saycrd-" + uid + "-" + key);
  return { key: key, deleted: true };
}
function _localList(prefix) {
  var uid = (currentUser && currentUser.id) || "local-user";
  var pfx = "saycrd-" + uid + "-";
  var keys = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(pfx) === 0) {
      var clean = k.slice(pfx.length);
      if (!prefix || clean.indexOf(prefix) === 0) keys.push(clean);
    }
  }
  return { keys: keys };
}

/* ── Sync local data up to Supabase (runs once after auth) ── */
async function _syncLocalToSupabase() {
  if (_storageMode() !== "supabase") return;
  var uid = currentUser.id;
  var pfx = "saycrd-" + uid + "-";
  var synced = 0;
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(pfx) === 0) {
      var cleanKey = k.slice(pfx.length);
      var val = localStorage.getItem(k);
      if (!val) continue;
      try {
        /* Check if supabase already has this key */
        var { data } = await sbClient.from("user_data").select("key").eq("user_id", uid).eq("key", cleanKey).limit(1);
        if (!data || data.length === 0) {
          /* Supabase doesn't have it — push local up */
          var parsed; try { parsed = JSON.parse(val); } catch(e) { parsed = val; }
          await sbClient.from("user_data").upsert({ user_id: uid, key: cleanKey, value: parsed }, { onConflict: "user_id,key" });
          synced++;
        }
      } catch(e) { /* skip silently */ }
    }
  }
  if (synced > 0) console.log("Synced " + synced + " local keys to Supabase");
}

/* ── Migrate pre-auth (anonymous) localStorage into the real signed-in uid ── */
/* Sessions saved while anonymous ("local") or in the "Continue without      */
/* account" bypass ("local-user") live under different localStorage keys    */
/* than a real Supabase user id. Without this, they're invisible after      */
/* sign-in — _syncLocalToSupabase only pushes keys already namespaced under */
/* the NEW uid, so pre-auth data would otherwise never reach the account.   */
function _migrateLegacyLocalKeys(uid) {
  if (!uid || uid === "local-user" || uid === "local") return;
  var legacyUids = ["local-user", "local"]; /* priority order */
  var localUserPfx = "saycrd-local-user-";
  var newPfx = "saycrd-" + uid + "-";
  var migrated = 0;
  legacyUids.forEach(function(legacyUid) {
    var legacyPfx = "saycrd-" + legacyUid + "-";
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(legacyPfx) !== 0) continue;
      /* "saycrd-local-" is a prefix of "saycrd-local-user-" — when scanning
         the shorter "local" uid, skip keys that actually belong to the more
         specific "local-user" uid (already migrated in the prior pass). */
      if (legacyUid === "local" && k.indexOf(localUserPfx) === 0) continue;
      keys.push(k);
    }
    keys.forEach(function(k) {
      var cleanKey = k.slice(legacyPfx.length);
      var newKey = newPfx + cleanKey;
      var legacyVal = localStorage.getItem(k);
      if (!legacyVal) return;
      if (cleanKey === "sessions") {
        /* Merge by the session's own date timestamp — the same dedup key
           _hydrateFromServer uses — so re-running this on a later sign-in
           can't duplicate sessions. */
        var existing = [];
        try { existing = JSON.parse(localStorage.getItem(newKey) || "[]"); } catch(e) {}
        if (!Array.isArray(existing)) existing = [];
        var legacySessions = [];
        try { legacySessions = JSON.parse(legacyVal || "[]"); } catch(e) {}
        if (!Array.isArray(legacySessions) || legacySessions.length === 0) return;
        var seen = {};
        existing.forEach(function(s) { if (s && s.date) seen[s.date] = true; });
        var added = 0;
        legacySessions.forEach(function(s) {
          if (!s || !s.date || seen[s.date]) return;
          seen[s.date] = true;
          existing.push(s);
          added++;
        });
        if (added > 0) {
          existing.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
          localStorage.setItem(newKey, JSON.stringify(existing));
          migrated += added;
        }
      } else if (localStorage.getItem(newKey) === null) {
        /* Non-session key: only copy if the real account doesn't already have it. */
        localStorage.setItem(newKey, legacyVal);
        migrated++;
      }
      /* Leave the old anonymous-uid key in place — harmless leftover,
         avoids data loss if migration partially fails. Just stop reading
         from it going forward (loadSessions()/_sessionKey() already key
         off getCurrentUid(), which resolves to the real uid post-migration). */
    });
  });
  if (migrated > 0) console.log("[SAYCRD] Migrated " + migrated + " item(s) from anonymous storage into account " + uid);
}

/* ── Hydrate localStorage from Supabase (runs after auth on new/different device) ── */
/* Fetches sessions from server and merges with local.                                */
async function _hydrateFromServer() {
  if (!currentUser || !supabaseAvailable || currentUser.id === "local-user") return;
  var uid = currentUser.id;
  try {
    var { data, error } = await sbClient
      .from("user_data")
      .select("value, updated_at")
      .eq("user_id", uid)
      .eq("key", "sessions")
      .limit(1);
    if (error || !data || data.length === 0) return;
    var serverSessions = Array.isArray(data[0].value) ? data[0].value : JSON.parse(data[0].value || "[]");
    if (!Array.isArray(serverSessions) || serverSessions.length === 0) return;

    var localKey = "saycrd-" + uid + "-sessions";
    var localSessions = [];
    try { localSessions = JSON.parse(localStorage.getItem(localKey) || "[]"); } catch(e) {}

    // Merge by date string. This used to concat server-then-local and keep
    // whichever copy of a shared date appeared FIRST — i.e. the server's.
    // This function runs on every SIGNED_IN event, which supabase-js also
    // fires on a plain page reload/relaunch (not just a fresh sign-in on a
    // new device) whenever it restores a persisted session. So on ANY
    // reload, if the local copy has a just-generated field report (or
    // sentence-feedback edit) that hasn't finished its own async push to
    // Supabase yet — very easy on mobile, where the app gets backgrounded
    // or relaunched moments after finishing a session — the server's older,
    // report-less copy of that same date SILENTLY OVERWROTE the local one.
    // The cached report was gone, so every later "Read Your Report" click
    // looked like it was generating from scratch again, even for a report
    // that had already been written once. Fix: for a shared date, merge the
    // two objects with the LOCAL fields taking priority — local always has
    // everything the server does (it's the source every push comes from)
    // plus anything generated since the last successful push, so it can
    // only ever be equal to or richer than the server's copy.
    var localByDate = {};
    localSessions.forEach(function(s) { if (s && s.date) localByDate[s.date] = s; });
    var merged = serverSessions.map(function(s) {
      if (s && s.date && localByDate[s.date]) return Object.assign({}, s, localByDate[s.date]);
      return s;
    }).filter(function(s) { return s && s.date; });
    var mergedDates = {};
    merged.forEach(function(s) { mergedDates[s.date] = true; });
    localSessions.forEach(function(s) {
      if (s && s.date && !mergedDates[s.date]) { merged.push(s); mergedDates[s.date] = true; }
    });
    merged.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
    if (merged.length > 100) merged = merged.slice(-100);

    if (merged.length > localSessions.length) {
      localStorage.setItem(localKey, JSON.stringify(merged));
      console.log("[SAYCRD] Hydrated from server:", merged.length, "sessions (had", localSessions.length, "locally)");
      // Trigger app re-read by firing a custom event React can listen to
      try { window.dispatchEvent(new CustomEvent("saycrd-sessions-hydrated", { detail: { count: merged.length } })); } catch(e) {}
    }

    // Push any local-only sessions back to server
    if (merged.length > serverSessions.length) {
      await sbClient.from("user_data").upsert(
        { user_id: uid, key: "sessions", value: merged },
        { onConflict: "user_id,key" }
      );
      console.log("[SAYCRD] Pushed merged sessions back to server.");
    }
  } catch(e) {
    console.warn("[SAYCRD] Hydration failed (not critical):", e);
  }
}

window.storage = {
  async get(key) {
    await _authReady;
    if (!currentUser) throw new Error("Not authenticated");
    if (_storageMode() === "local") return _localGet(key);
    try {
      const { data, error } = await sbClient
        .from("user_data")
        .select("key, value")
        .eq("user_id", currentUser.id)
        .eq("key", key)
        .limit(1);
      if (error) { console.warn("Supabase get error for '" + key + "':", error.message); return _localGet(key); }
      var row = data && data.length > 0 ? data[0] : null;
      if (row) {
        /* Got from Supabase — also update local cache */
        var val = JSON.stringify(row.value);
        _localSet(key, val);
        return { key: row.key, value: val };
      }
      /* Supabase returned nothing — check if local has it (migration case) */
      var local = _localGet(key);
      if (local && local.value) {
        /* Push local data up to Supabase */
        try {
          var parsed; try { parsed = JSON.parse(local.value); } catch(e) { parsed = local.value; }
          await sbClient.from("user_data").upsert({ user_id: currentUser.id, key: key, value: parsed }, { onConflict: "user_id,key" });
          console.log("Migrated '" + key + "' from local to Supabase");
        } catch(e) { /* migration failed, no big deal */ }
        return local;
      }
      return null;
    } catch(e) { console.warn("Supabase get failed for '" + key + "':", e); return _localGet(key); }
  },

  async set(key, value) {
    await _authReady;
    if (!currentUser) throw new Error("Not authenticated");
    /* Always write to localStorage as backup */
    _localSet(key, value);
    if (_storageMode() === "local") return { key: key, value: value };
    try {
      let parsed;
      try { parsed = JSON.parse(value); } catch(e) { parsed = value; }
      const { error } = await sbClient
        .from("user_data")
        .upsert({
          user_id: currentUser.id,
          key: key,
          value: parsed
        }, { onConflict: "user_id,key" });
      if (error) { console.warn("Supabase set error for '" + key + "':", error.message); }
      return { key: key, value: value };
    } catch(e) { console.warn("Supabase set failed for '" + key + "':", e); return { key: key, value: value }; }
  },

  async delete(key) {
    await _authReady;
    if (!currentUser) throw new Error("Not authenticated");
    _localDelete(key);
    if (_storageMode() === "local") return { key: key, deleted: true };
    try {
      const { error } = await sbClient
        .from("user_data")
        .delete()
        .eq("user_id", currentUser.id)
        .eq("key", key);
      if (error) console.warn("Supabase delete error:", error.message);
    } catch(e) { console.warn("Supabase delete failed:", e); }
    return { key: key, deleted: true };
  },

  async list(prefix) {
    await _authReady;
    if (!currentUser) throw new Error("Not authenticated");
    if (_storageMode() === "local") return _localList(prefix);
    try {
      let query = sbClient
        .from("user_data")
        .select("key")
        .eq("user_id", currentUser.id);
      if (prefix) query = query.like("key", prefix + "%");
      const { data, error } = await query;
      if (error) { console.warn("Supabase list error:", error.message); return _localList(prefix); }
      return { keys: (data || []).map(function(d) { return d.key; }) };
    } catch(e) { console.warn("Supabase list failed:", e); return _localList(prefix); }
  }
};

/* ====================================================================
   FAILSAFE BYPASS — works even if Supabase is completely broken
   ==================================================================== */
window._showAuthOverlay = function(onSuccess) {
  var overlay = document.getElementById("auth-overlay");
  if (overlay) {
    overlay.style.display = "flex";
    overlay.classList.add("is-visible");
    if (onSuccess) window._authSuccessCallback = onSuccess;
    setTimeout(function() {
      var first = document.getElementById("auth-email") || document.getElementById("auth-signup-email") || document.getElementById("auth-reset-email");
      if (first) first.focus();
    }, 120);
  }
};

window._localBypass = function() {
  currentUser = { id: "local-user", email: "local@saycrd" };
  window.currentUser = currentUser;
  if (_authResolve) _authResolve();
  /* storage already handles local mode via _storageMode() check */
  var overlay = document.getElementById("auth-overlay");
  if (overlay) {
    overlay.classList.remove("is-visible");
    overlay.style.transition = "opacity .4s ease";
    setTimeout(function() { overlay.style.display = "none"; }, 400);
  }
  var signoutEl = document.getElementById("ws-signout");
  if (signoutEl) { signoutEl.textContent = "local \u00B7 sign out"; signoutEl.dataset.initial = "L"; signoutEl.title = "local \u00B7 sign out"; }
  window.dispatchEvent(new CustomEvent("saycrd-auth-change"));
  console.log("LOCAL BYPASS ACTIVE — using localStorage");
};

/* ── Auth: restore session + sign out (all form handlers are inline in HTML) ── */
(function() {
  try {
    if (sbClient && sbClient.auth) {
      sbClient.auth.getSession().then(function(result) {
        if (result.data.session) {
          currentUser = result.data.session.user;
          window.currentUser = currentUser;
          window._saycrdToken = result.data.session.access_token;
          var o = document.getElementById("auth-overlay");
          if (o) { o.classList.remove("is-visible"); o.style.transition = "opacity .4s ease"; setTimeout(function(){ o.style.display = "none"; }, 400); }
          var sn = document.getElementById("ws-signout");
          if (sn && currentUser.email) { var u = currentUser.email.split("@")[0]; sn.textContent = u + " \u00B7 sign out"; sn.dataset.initial = (u || "S").charAt(0).toUpperCase(); sn.title = u + " \u00B7 sign out"; }
          window.dispatchEvent(new CustomEvent("saycrd-auth-change"));
          console.log("Session restored for:", currentUser.email);
          /* Resolve auth gate so storage ops proceed */
          if (_authResolve) _authResolve();
          /* Sync any local-only data up to Supabase */
          _syncLocalToSupabase().catch(function(e) { console.warn("Sync failed:", e); });
        } else {
          /* No session — resolve gate anyway so local mode works */
          if (_authResolve) _authResolve();
        }
      }).catch(function(e) {
        console.warn("Session restore failed:", e);
        if (_authResolve) _authResolve();
      });

      sbClient.auth.onAuthStateChange(function(event, session) {
        if (session && session.user) {
          currentUser = session.user;
          window.currentUser = currentUser;
          window._saycrdToken = session.access_token;
          var o = document.getElementById("auth-overlay");
          if (o) { o.classList.remove("is-visible"); o.style.transition = "opacity .4s ease"; setTimeout(function(){ o.style.display = "none"; }, 400); }
          var sn = document.getElementById("ws-signout");
          if (sn && session.user.email) { var u = session.user.email.split("@")[0]; sn.textContent = u + " \u00B7 sign out"; sn.dataset.initial = (u || "S").charAt(0).toUpperCase(); sn.title = u + " \u00B7 sign out"; }
          window.dispatchEvent(new CustomEvent("saycrd-auth-change"));
          /* Resolve auth gate on sign-in too */
          if (_authResolve) _authResolve();
          /* On sign-in: hydrate from server first (new device recovery),
             then push any local-only data up. Both are non-blocking. */
          if (event === "SIGNED_IN") {
            try { _migrateLegacyLocalKeys(session.user.id); } catch(e) { console.warn("[SAYCRD] Legacy key migration failed:", e); }
            _hydrateFromServer().then(function() {
              return _syncLocalToSupabase();
            }).catch(function(e) { console.warn("[SAYCRD] Post-login sync failed:", e); });
          }
        }
      });
    } else {
      /* No supabase — resolve immediately */
      if (_authResolve) _authResolve();
    }
  } catch(e) {
    console.warn("Auth init:", e);
    if (_authResolve) _authResolve();
  }

  function doSignOut() {
    try { if (sbClient && sbClient.auth) sbClient.auth.signOut(); } catch(e) {}
    currentUser = null;
    window.currentUser = null;
    var sn = document.getElementById("ws-signout");
    if (sn) { sn.textContent = "Sign out"; sn.dataset.initial = "S"; sn.title = "Sign out"; }
    window.dispatchEvent(new CustomEvent("saycrd-auth-change"));
    var o = document.getElementById("auth-overlay");
    if (o) { o.style.display = ""; o.style.opacity = "1"; }
  }
  window._signOut = doSignOut;
  document.getElementById("ws-signout")?.addEventListener("click", function() { doSignOut(); });
})();
</script>

<script>
  window.callClaude = async function(sys, usr, max) {
    try {
      var maxTokens = max || 3500;
      var body = JSON.stringify({
        model: "claude-sonnet-4-5-20250929",
        max_tokens: maxTokens,
        messages: [{ role: "user", content: sys + "\n\n---\n\nUser text:\n\n" + (usr || "") }]
      });
      var endpoint = (window.SAYCRD_CONFIG && window.SAYCRD_CONFIG.API_ENDPOINT) || "/api/claude";
      var headers = { "Content-Type": "application/json" };
      var ensureToken = async function() {
        if (window._saycrdToken) return window._saycrdToken;
        if (window.sbClient && window.sbClient.auth) {
          try {
            var ss = await window.sbClient.auth.getSession();
            if (ss && ss.data && ss.data.session && ss.data.session.access_token) {
              window._saycrdToken = ss.data.session.access_token;
              return window._saycrdToken;
            }
          } catch(e) {}
        }
        // Local/failsafe bypass mode has no real Supabase session (by design, so it
        // still works even if Supabase is completely down) — fall back to the public
        // anon key just so the proxy's "Authorization header present" check passes.
        // This is not a real credential check server-side (see api/claude.js), so this
        // fallback grants bypass users the same access level they already have.
        if (window.currentUser && window.currentUser.id === "local-user") {
          // NOTE: SAYCRD_CONFIG is declared with `const` in an earlier <script> tag, so
          // it is NOT a property of `window` (unlike `var`) — reference it by bare name.
          var anonKey = typeof SAYCRD_CONFIG !== "undefined" && SAYCRD_CONFIG.SUPABASE_ANON_KEY;
          if (anonKey) return anonKey;
        }
        return null;
      };
      var _tok = await ensureToken();
      if (_tok) headers["Authorization"] = "Bearer " + _tok;
      var r = await fetch(endpoint, { method: "POST", headers: headers, body: body });
      if (r.status === 401) {
        // Token race after refresh: try once more.
        headers = { "Content-Type": "application/json" };
        await new Promise(function(res){ setTimeout(res, 180); });
        _tok = await ensureToken();
        if (_tok) headers["Authorization"] = "Bearer " + _tok;
        r = await fetch(endpoint, { method: "POST", headers: headers, body: body });
      }
      if (!r.ok) {
        var errText = await r.text().catch(function(){ return ""; });
        throw new Error("Proxy " + r.status + ": " + errText.slice(0, 400));
      }
      var data = await r.json();
      var text = "";
      if (data.content && Array.isArray(data.content)) {
        for (var i = 0; i < data.content.length; i++) {
          if (data.content[i].type === "text" && data.content[i].text) text += data.content[i].text;
        }
      }
      return text;
    } catch (e) {
      console.error("[SAYCRD] Proxy callClaude failed:", e);
      throw e;
    }
  };

// Legacy Babel error handler removed (jsxCode now in app.jsx)
</script>
